<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidya Dairy Inventory & Dispatch Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ncdfiPurple: '#403486',
                        vidyaGreen: '#159447',
                        vidyaBlue: '#1478D4',
                        navyDark: '#142D52',
                        bgLight: '#F7F9FC',
                        textMain: '#303744'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F7F9FC;
            color: #303744;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Brand Logos Styling Requirements */
        .brand-logos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
        }
        .brand-logo {
            display: block;
            width: auto;
            height: 72px;
            max-width: 45%;
            object-fit: contain;
            object-position: center;
        }
        .vidya-logo {
            height: 76px;
        }
        .ncdfi-logo {
            height: 82px;
        }

        /* Main (hero) section logos - larger than header/footer */
        .hero-logos {
            gap: 40px;
        }
        .hero-logos .brand-logo {
            max-width: 46%;
        }
        .hero-logos .vidya-logo {
            height: 120px;
        }
        .hero-logos .ncdfi-logo {
            height: 130px;
        }

        /* Footer NCDFI logo rendered in white */
        .footer-ncdfi-logo {
            filter: brightness(0) invert(1);
        }

        @media (max-width: 600px) {
            .brand-logos {
                justify-content: center;
                gap: 16px;
            }
            .brand-logo {
                max-width: 44%;
                height: 56px;
            }
            .hero-logos {
                gap: 20px;
            }
            .hero-logos .vidya-logo {
                height: 84px;
            }
            .hero-logos .ncdfi-logo {
                height: 90px;
            }
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.92; transform: scale(1.01); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-bgLight text-textMain antialiased min-h-screen selection:bg-vidyaGreen selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Mock Data & Constants ---
        const workflowStages = [
            {
                id: 1,
                title: "Product Master",
                short: "Define core product attributes, pack sizes & hierarchy.",
                icon: "Layers",
                inputs: ["Product Master Sheet", "Packaging Standards", "MRP Rules"],
                activities: ["Configure product code, name, and shelf-life", "Set units per Corrugated Box (CBX)", "Establish CBX per Crate hierarchy", "Maintain active/inactive state and audit trail"],
                validations: ["Unique product code check", "Mandatory hierarchy ratios"],
                outputs: ["Approved Product Master Record"]
            },
            {
                id: 2,
                title: "Batch Management",
                short: "Generate and configure production batch parameters.",
                icon: "Tag",
                inputs: ["Production Schedule", "Packaging Date", "Product Master"],
                activities: ["Select product & manufacturing date", "Generate unique batch number (e.g., DAF 291 1)", "Calculate precise expiry date based on shelf-life", "Confirm year code and lot numbering logic"],
                validations: ["Valid future/past packaging date range", "No duplicate active batch code"],
                outputs: ["Configured Batch ID & Expiry Schedule"]
            },
            {
                id: 3,
                title: "Label Generation & Approval",
                short: "Create and validate label printing parameters.",
                icon: "FileText",
                inputs: ["Batch ID", "Required Quantity", "MRP & Crate Capacity"],
                activities: ["Fill label generation application form", "Specify carton and crate label distribution", "Review label content against product master", "Trigger supervisory approval workflow"],
                validations: ["Mandatory field checks", "Approval status verification prior to print"],
                outputs: ["Approved Label Job Order"]
            },
            {
                id: 4,
                title: "QR Label Printing",
                short: "Print physical QR labels for cartons and crates.",
                icon: "Printer",
                inputs: ["Approved Label Job", "Printer Configuration"],
                activities: ["Format 75mm x 38mm sample product label", "Generate distinct identifiers for carton & parent crate", "Execute print job via thermal printer simulation", "Verify reprint reuses original identifier without inventory inflation"],
                validations: ["Ensure printing does NOT increment inventory", "Carton-to-crate structural pairing validation"],
                outputs: ["Printed Physical QR Labels"]
            },
            {
                id: 5,
                title: "Cold-Storage Receipt",
                short: "Scan and inward stock into cold-storage inventory.",
                icon: "Snowflake",
                inputs: ["Physical Crate/Carton QR Labels", "Cold-Storage Bay Entry"],
                activities: ["Simulate scanning QR code at cold-storage dock", "Inspect package metadata (Product, Batch, Expiry, Qty)", "Detect duplicate scans or unknown codes", "Confirm inward receipt"],
                validations: ["Duplicate scan prevention", "Invalid QR code rejection", "Crate content capacity mismatch check"],
                outputs: ["Updated Cold-Storage Inward Stock"]
            },
            {
                id: 6,
                title: "Purchase-Order Upload",
                short: "Ingest customer federation purchase orders.",
                icon: "UploadCloud",
                inputs: ["Federation PO File (Excel/CSV)", "Customer Directory"],
                activities: ["Upload sample PO spreadsheet", "Parse federation, order number, required dates", "Validate row-level product codes & quantities", "Detect duplicate PO submissions"],
                validations: ["Phase 1: Excel/CSV format compliance only (No direct SAP yet)", "Row error flagging & isolation"],
                outputs: ["Validated Active Order Queue"]
            },
            {
                id: 7,
                title: "Stock Availability Check",
                short: "Real-time stock ledger analysis & segregation.",
                icon: "PieChart",
                inputs: ["Cold-Storage Inventory Ledger", "Active Order Requirements"],
                activities: ["Calculate Received vs Reserved vs Available stock", "Isolate blocked, damaged, and expired lots", "Filter stock by product code and batch", "Distinguish physically received from saleable stock"],
                validations: ["Zero negative stock verification", "Quarantine status filter"],
                outputs: ["Net Available Stock Summary"]
            },
            {
                id: 8,
                title: "FEFO Batch Selection",
                short: "First-Expired, First-Out automated stock allocation.",
                icon: "ArrowUpDown",
                inputs: ["Available Batches", "Expiry Dates", "Minimum Shelf-Life Rules"],
                activities: ["Sort eligible batches by earliest expiry date first", "Exclude expired, damaged, or blocked lots", "Apply minimum remaining shelf-life threshold rule", "Recommend optimal batch for order fulfillment"],
                validations: ["Strict FEFO adherence check", "Shelf-life compliance verification"],
                outputs: ["Recommended Batch Allocation List"]
            },
            {
                id: 9,
                title: "Picking & QR Verification",
                short: "Scan and verify items against picking list.",
                icon: "CheckSquare",
                inputs: ["Picking List", "Warehouse Floor Cartons/Crates"],
                activities: ["Present interactive picking list (Carton/Crate IDs)", "Simulate scanner verification per item", "Flag wrong product or wrong batch scans", "Enforce supervisor approval for alternative packages"],
                validations: ["Real-time scan vs expected list match", "Block ineligible stock from picking"],
                outputs: ["Verified Picked Packages Counter"]
            },
            {
                id: 10,
                title: "Dispatch Validation",
                short: "Final audit before truck loading & dispatch.",
                icon: "Truck",
                inputs: ["Picked Packages", "Purchase Order Requirements"],
                activities: ["Compare Ordered, Reserved, Picked, and Ready quantities", "Review dispatch readiness and approval status", "Prompt warning if picked quantity is below ordered amount", "Enforce supervisor authorization for partial dispatch"],
                validations: ["Partial dispatch restriction check", "Mandatory dispatch clearance sign-off"],
                outputs: ["Authorized Dispatch Clearance"]
            },
            {
                id: 11,
                title: "Inventory Update & Reporting",
                short: "Post-dispatch ledger adjustment & audit reporting.",
                icon: "BarChart3",
                inputs: ["Confirmed Dispatch Record"],
                activities: ["Deduct dispatched stock from inventory ledger", "Record full traceability chain (Product -> Batch -> Carton -> Dispatch)", "Generate operational reports (Shortages, Expiry, Mismatches)", "Archive transaction in audit trail"],
                validations: ["Single-deduction ledger integrity", "Complete audit trail logging"],
                outputs: ["Final Dispatch Reference & Analytics Reports"]
            }
        ];

        const initialInventory = [
            { id: "INV-101", product: "Amul Gold Milk 500ml", batch: "DAF-291-1", category: "Carton", qty: 450, expiry: "2026-05-12", status: "Available", location: "Bay A-1" },
            { id: "INV-102", product: "Vidya Butter 500g", batch: "DAF-288-4", category: "Carton", qty: 220, expiry: "2026-04-20", status: "Available", location: "Bay A-2" },
            { id: "INV-103", product: "Vidya Curd 1kg Cup", batch: "DAF-295-2", category: "Crate", qty: 150, expiry: "2026-04-10", status: "Available", location: "Bay B-1" },
            { id: "INV-104", product: "Amul Taaza 1L", batch: "DAF-270-9", category: "Carton", qty: 85, expiry: "2026-04-02", status: "Expiring Soon", location: "Bay C-1" },
            { id: "INV-105", product: "Vidya Paneer 200g", batch: "DAF-301-3", category: "Crate", qty: 310, expiry: "2026-04-28", status: "Available", location: "Bay B-3" }
        ];

        const sampleOrders = [
            { poNo: "PO-2026-881", federation: "Banaskantha Union", date: "2026-04-02", requiredDate: "2026-04-05", product: "Amul Gold Milk 500ml", qty: 200, uom: "Cartons", status: "Pending" },
            { poNo: "PO-2026-882", federation: "Sabarkantha Union", date: "2026-04-02", requiredDate: "2026-04-06", product: "Vidya Butter 500g", qty: 100, uom: "Cartons", status: "Approved" },
            { poNo: "PO-2026-883", federation: "Mehsana Union", date: "2026-04-03", requiredDate: "2026-04-07", product: "Vidya Curd 1kg Cup", qty: 75, uom: "Crates", status: "Pending" }
        ];

        // --- Main App Component ---
        function App() {
            const [activeSection, setActiveSection] = useState('hero');
            const [currentStageIndex, setCurrentStageIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [selectedModalStage, setSelectedModalStage] = useState(null);
            const [dashboardTab, setDashboardTab] = useState('overview');

            // Interactive simulation states
            const [receiptLogs, setReceiptLogs] = useState([
                { id: "CRATE-9921", product: "Amul Gold Milk 500ml", batch: "DAF-291-1", qty: 50, status: "Verified & Received" }
            ]);
            const [scanInput, setScanInput] = useState("");
            const [scanStatus, setScanStatus] = useState(null);

            const [poList, setPoList] = useState(sampleOrders);
            const [poUploadStatus, setPoUploadStatus] = useState(null);

            const [inventoryList, setInventoryList] = useState(initialInventory);
            const [pickingList, setPickingList] = useState([
                { id: "CRT-501", product: "Amul Gold Milk 500ml", batch: "DAF-291-1", expected: 50, scanned: 50, status: "Verified" },
                { id: "CRT-502", product: "Vidya Butter 500g", batch: "DAF-288-4", expected: 30, scanned: 15, status: "Pending" }
            ]);
            const [dispatchReady, setDispatchReady] = useState(false);
            const [dispatchApproved, setDispatchApproved] = useState(false);

            // Auto-play workflow effect
            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        setCurrentStageIndex((prev) => (prev + 1) % workflowStages.length);
                    }, 3500);
                }
                return () => clearInterval(interval);
            }, [isPlaying]);

            // Scroll to section helper
            const scrollToSection = (id) => {
                setActiveSection(id);
                const el = document.getElementById(id);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans text-textMain bg-bgLight">
                    
                    {/* Top Announcement Bar */}
                    <div className="bg-navyDark text-white text-xs py-2 px-4 text-center font-medium flex items-center justify-center gap-3">
                        <span className="bg-vidyaGreen text-white px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">Proposal Demo</span>
                        <span>Vidya Dairy Inventory &amp; Dispatch Management System • Technology Partner: NCDFI</span>
                        <span className="hidden md:inline text-slate-300">| Status: Pending Business Validation</span>
                    </div>

                    {/* Navigation Header */}
                    <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            
                            {/* Official Brand Logos Header Representation */}
                                {/* <div className="brand-logos flex items-center gap-4 py-2">
                                <img
                                    src="vidya_dairy_logo.jpg"
                                    onError={(e) => { e.target.src = "vidya_dairy_logo_2.jpg"; }}
                                    alt="Vidya Dairy logo"
                                    className="brand-logo vidya-logo"
                                />

                                <img
                                    src="NCDFI_Logo.png"
                                    onError={(e) => { e.target.src = "NCDFI Logo - 26122022_2.png"; }}
                                    alt="NCDFI — National Cooperative Dairy Federation of India"
                                    className="brand-logo ncdfi-logo"
                                />
                            </div>*/}

                            {/* Nav Links */}
                            <nav className="hidden lg:flex items-center gap-6 text-sm font-medium text-slate-600">
                                <button onClick={() => scrollToSection('workflow')} className="hover:text-vidyaGreen transition-colors">Workflow</button>
                                <button onClick={() => scrollToSection('interactive-deep')} className="hover:text-vidyaGreen transition-colors">Process Stages</button>
                                <button onClick={() => scrollToSection('dashboard')} className="hover:text-vidyaGreen transition-colors">Dashboard Demo</button>
                                <button onClick={() => scrollToSection('controls')} className="hover:text-vidyaGreen transition-colors">Controls</button>
                                <button onClick={() => scrollToSection('scope')} className="hover:text-vidyaGreen transition-colors">Phase 1 vs 2</button>
                                <button onClick={() => scrollToSection('benefits')} className="hover:text-vidyaGreen transition-colors">Benefits</button>
                            </nav>

                            {/* Action CTA */}
                            <div className="flex items-center gap-3">
                                <button onClick={() => scrollToSection('dashboard')} className="bg-vidyaBlue hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-xl shadow transition text-sm flex items-center gap-2">
                                    <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                                    <span>Live Preview</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* SECTION A: Hero & Project Introduction */}
                    <section id="hero" className="relative overflow-hidden bg-gradient-to-b from-white via-[#F7F9FC] to-[#edf2f7] py-16 lg:py-24 border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            
                            <div className="max-w-3xl mx-auto text-center">
                                
                                {/* Hero Logos Display */}
                                <div className="brand-logos hero-logos flex items-center justify-center gap-6 mb-10 py-2">
                                    <img
                                        src="vidya_dairy_logo.jpg"
                                        onError={(e) => { e.target.src = "vidya_dairy_logo_2.jpg"; }}
                                        alt="Vidya Dairy logo"
                                        className="brand-logo vidya-logo"
                                    />
                                    <img
                                        src="NCDFI_Logo.png"
                                        onError={(e) => { e.target.src = "NCDFI Logo - 26122022_2.png"; }}
                                        alt="NCDFI — National Cooperative Dairy Federation of India"
                                        className="brand-logo ncdfi-logo"
                                    />
                                </div>

                                <div className="inline-flex items-center gap-2 bg-purple-50 border border-purple-200 text-ncdfiPurple px-3 py-1 rounded-full text-xs font-semibold mb-6 shadow-sm">
                                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                                    <span>Proposed Solution — Pending Business Validation</span>
                                </div>

                                <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-navyDark tracking-tight leading-tight mb-6">
                                    From Packaging to Dispatch. <span className="text-vidyaGreen block sm:inline">Every Step Traceable.</span>
                                </h1>

                                <p className="text-lg sm:text-xl text-slate-600 mb-10 leading-relaxed">
                                    Proposed digital inventory and dispatch management for Vidya Dairy, connecting product identification, QR-based inventory tracking, stock allocation, picking and dispatch through a structured workflow.
                                </p>

                                {/* Visual Badges */}
                                <div className="flex flex-wrap justify-center gap-3 sm:gap-4 mb-10">
                                    <div className="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl shadow-sm font-medium text-sm text-slate-700">
                                        <div className="w-2.5 h-2.5 rounded-full bg-vidyaGreen"></div>
                                        <span>QR-Code Traceability</span>
                                    </div>
                                    <div className="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl shadow-sm font-medium text-sm text-slate-700">
                                        <div className="w-2.5 h-2.5 rounded-full bg-vidyaBlue"></div>
                                        <span>FEFO-Based Picking</span>
                                    </div>
                                    <div className="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl shadow-sm font-medium text-sm text-slate-700">
                                        <div className="w-2.5 h-2.5 rounded-full bg-ncdfiPurple"></div>
                                        <span>Controlled Inventory Movement</span>
                                    </div>
                                </div>

                                {/* CTA Buttons */}
                                <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                                    <button onClick={() => scrollToSection('workflow')} className="w-full sm:w-auto bg-vidyaGreen hover:bg-emerald-700 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2 text-base">
                                        <span>Explore the Process</span>
                                        <i data-lucide="arrow-down" className="w-5 h-5"></i>
                                    </button>
                                    <button onClick={() => scrollToSection('interactive-deep')} className="w-full sm:w-auto bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold px-8 py-3.5 rounded-xl shadow-sm transition text-base">
                                        View System Modules
                                    </button>
                                </div>
                            </div>

                        </div>
                    </section>

                    {/* SECTION B: Animated End-to-End Workflow */}
                    <section id="workflow" className="py-20 bg-white border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            
                            <div className="text-center max-w-2xl mx-auto mb-16">
                                <span className="text-vidyaBlue font-bold tracking-wider uppercase text-xs">End-to-End Workflow</span>
                                <h2 className="text-3xl sm:text-4xl font-extrabold text-navyDark mt-2">11-Stage Operational Pipeline</h2>
                                <p className="text-slate-600 mt-3">
                                    Click any card for detailed inputs, activities, and validations, or use the player controls to watch the automated sequence.
                                </p>

                                {/* Playback Controls */}
                                <div className="flex flex-wrap items-center justify-center gap-3 mt-8 bg-slate-100 p-3 rounded-2xl max-w-xl mx-auto border border-slate-200">
                                    <button 
                                        onClick={() => setIsPlaying(!isPlaying)}
                                        className={`px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2 transition ${isPlaying ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-vidyaGreen hover:bg-emerald-700 text-white'}`}
                                    >
                                        <i data-lucide={isPlaying ? "pause" : "play"} className="w-4 h-4"></i>
                                        <span>{isPlaying ? "Pause Demo" : "Play Process"}</span>
                                    </button>
                                    
                                    <button 
                                        onClick={() => setCurrentStageIndex((prev) => (prev > 0 ? prev - 1 : workflowStages.length - 1))}
                                        className="bg-white hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-sm font-semibold border border-slate-300 transition"
                                    >
                                        Prev
                                    </button>

                                    <span className="text-sm font-bold text-navyDark px-2">
                                        Stage {currentStageIndex + 1} of {workflowStages.length}
                                    </span>

                                    <button 
                                        onClick={() => setCurrentStageIndex((prev) => (prev + 1) % workflowStages.length)}
                                        className="bg-white hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-sm font-semibold border border-slate-300 transition"
                                    >
                                        Next
                                    </button>

                                    <button 
                                        onClick={() => { setIsPlaying(false); setCurrentStageIndex(0); }}
                                        className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-xl text-sm font-semibold transition"
                                        title="Restart"
                                    >
                                        <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>

                            {/* Workflow Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {workflowStages.map((stage, idx) => {
                                    const isActive = currentStageIndex === idx;
                                    return (
                                        <div 
                                            key={stage.id}
                                            onClick={() => { setCurrentStageIndex(idx); setSelectedModalStage(stage); }}
                                            className={`cursor-pointer bg-white rounded-2xl p-6 border transition-all duration-300 flex flex-col justify-between relative group hover:shadow-xl ${isActive ? 'ring-2 ring-vidyaGreen border-vidyaGreen shadow-lg scale-[1.02] bg-emerald-50/20' : 'border-slate-200 hover:border-slate-300'}`}
                                        >
                                            <div className="flex items-start justify-between mb-4">
                                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center font-bold text-white shadow-md transition-transform group-hover:scale-110 ${isActive ? 'bg-vidyaGreen' : 'bg-navyDark'}`}>
                                                    <span className="text-sm">{stage.id}</span>
                                                </div>
                                                <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 group-hover:bg-purple-100 group-hover:text-ncdfiPurple transition-colors">
                                                    Stage {stage.id}
                                                </span>
                                            </div>

                                            <div>
                                                <h3 className="text-lg font-bold text-navyDark group-hover:text-vidyaGreen transition-colors mb-2">
                                                    {stage.title}
                                                </h3>
                                                <p className="text-xs sm:text-sm text-slate-600 line-clamp-2 leading-relaxed">
                                                    {stage.short}
                                                </p>
                                            </div>

                                            <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-vidyaBlue">
                                                <span>View details &amp; rules</span>
                                                <i data-lucide="arrow-right" className="w-4 h-4 transform group-hover:translate-x-1 transition-transform"></i>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                        </div>
                    </section>

                    {/* SECTION C: Detailed Process-Stage Interactions */}
                    <section id="interactive-deep" className="py-20 bg-bgLight border-b border-slate-200">

                            <div className="text-center max-w-2xl mx-auto mb-16">

                                    <div>
                                        <h4 className="font-bold text-navyDark uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                            <i data-lucide="file-input" className="w-4 h-4 text-vidyaGreen"></i> Inputs
                                        </h4>
                                        <ul className="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-700">
                                            {selectedModalStage.inputs.map((inp, idx) => (
                                                <li key={idx} className="flex items-center gap-2">
                                                    <span className="w-1.5 h-1.5 rounded-full bg-vidyaGreen"></span>
                                                    <span>{inp}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-navyDark uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                            <i data-lucide="shield-check" className="w-4 h-4 text-vidyaBlue"></i> Validations
                                        </h4>
                                        <ul className="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-700">
                                            {selectedModalStage.validations.map((val, idx) => (
                                                <li key={idx} className="flex items-center gap-2">
                                                    <span className="w-1.5 h-1.5 rounded-full bg-vidyaBlue"></span>
                                                    <span>{val}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>

                                <div className="mb-8 text-xs">
                                    <h4 className="font-bold text-navyDark uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                        <i data-lucide="list-checks" className="w-4 h-4 text-ncdfiPurple"></i> Core Activities
                                    </h4>
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 text-slate-700">
                                        {selectedModalStage.activities.map((act, idx) => (
                                            <div key={idx} className="flex items-start gap-2">
                                                <span className="font-bold text-ncdfiPurple">{idx + 1}.</span>
                                                <span>{act}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button 
                                        onClick={() => setSelectedModalStage(null)}
                                        className="bg-navyDark hover:bg-slate-800 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition"
                                    >
                                        Close Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SECTION H: Footer and Governance Note */}
                    <footer className="bg-navyDark text-white py-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
                            
                            <div className="flex flex-col md:flex-row items-center justify-between gap-8 border-b border-slate-800 pb-12">
                                <div className="brand-logos flex items-center gap-6 py-2">
                                    <img
                                        src="vidya_dairy_logo.jpg"
                                        onError={(e) => { e.target.src = "vidya_dairy_logo_2.jpg"; }}
                                        alt="Vidya Dairy logo"
                                        className="brand-logo vidya-logo"
                                    />
                                    {/* NCDFI logo shown in white via CSS filter (.footer-ncdfi-logo) */}
                                    <img
                                        src="NCDFI_Logo.png"
                                        onError={(e) => { e.target.src = "NCDFI Logo - 26122022_2.png"; }}
                                        alt="NCDFI — National Cooperative Dairy Federation of India"
                                        className="brand-logo ncdfi-logo footer-ncdfi-logo"
                                    />
                                </div>

                                <div className="flex flex-wrap items-center gap-6 text-sm text-slate-300">
                                    <button onClick={() => scrollToSection('workflow')} className="hover:text-vidyaGreen transition-colors">Process Overview</button>
                                    <button onClick={() => scrollToSection('interactive-deep')} className="hover:text-vidyaGreen transition-colors">System Modules</button>
                                    <button onClick={() => scrollToSection('scope')} className="hover:text-vidyaGreen transition-colors">Phase 1 &amp; Phase 2</button>
                                    <button onClick={() => scrollToSection('controls')} className="hover:text-vidyaGreen transition-colors">Control Checkpoints</button>
                                </div>
                            </div>

                            <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 text-xs text-slate-300 leading-relaxed max-w-4xl mx-auto text-center">
                                <strong className="text-white block mb-2 text-sm">Governance &amp; Validation Disclaimer</strong>
                                This interactive webpage demonstrates a proposed process flow based on the initial requirements. Business rules, packaging mappings, shelf-life thresholds, batch numbering and approval controls remain subject to stakeholder validation. All figures and scans are demonstrative mock data.
                            </div>

                            <div className="flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 pt-4 border-t border-slate-800/60">
                                <p>© 2026 Vidya Dairy Inventory &amp; Dispatch Management System | Technology Partner: NCDFI</p>
                                    {/* <p className="mt-2 sm:mt-0">Enterprise UX/UI Demonstrator — Version 1.0</p>*/}
                            </div>

                        </div>
                    </footer>

                </div>
            );
        }

        // Render React App & initialize Lucide icons
        ReactDOM.render(<App />, document.getElementById('root'));
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 100);
    </script>
</body>
</html>
